<main class="h-full w-full overflow-y-auto px-6 py-10">
  <a routerLink="/quadriads" class="mb-6 inline-block text-sm text-slate-500 hover:text-slate-700">&larr; Tutte le quadriadi</a>

  @if (chord(); as c) {
    <div class="flex flex-col items-center gap-4 rounded-xl bg-white p-8 shadow" style="max-width: 420px">
      <h1 class="text-2xl font-bold text-slate-800">{{ c.name }}</h1>
      @if (c.notes) {
        <p class="text-sm font-medium text-emerald-600">{{ c.notes.join(' - ') }}</p>
      }
      <p class="text-center text-sm text-slate-500">{{ c.description }}</p>
      <app-fretboard-diagram [dots]="c.dots" [startFret]="c.startFret" [fretCount]="c.fretCount"></app-fretboard-diagram>
    </div>
  } @else {
    <p class="text-slate-500">Quadriade non trovata.</p>
  }
</main>

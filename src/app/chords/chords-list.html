<main class="h-full w-full overflow-y-auto px-6 py-10">
  <h1 class="mb-6 text-3xl font-bold text-slate-800">Accordi</h1>

  <div class="grid grid-cols-2 gap-4 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6">
    @for (entry of chords; track entry.chord.id) {
      <a
        [routerLink]="['/chords', entry.chord.id]"
        class="flex flex-col items-center gap-2 rounded-xl bg-white p-4 shadow transition hover:shadow-md"
      >
        <span class="text-sm font-semibold text-slate-800">{{ entry.chord.name }}</span>
        <app-fretboard-diagram
          [dots]="entry.dots"
          [mutedStrings]="entry.muted"
          [startFret]="entry.chord.startFret ?? 1"
          [fretCount]="4"
        ></app-fretboard-diagram>
      </a>
    }
  </div>
</main>

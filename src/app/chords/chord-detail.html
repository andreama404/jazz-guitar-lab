<main class="h-full w-full overflow-y-auto px-6 py-10">
  <a routerLink="/chords" class="mb-6 inline-block text-sm text-slate-500 hover:text-slate-700">&larr; Tutti gli accordi</a>

  @if (chord(); as c) {
    <div class="flex flex-col items-center gap-4 rounded-xl bg-white p-8 shadow" style="max-width: 320px">
      <h1 class="text-2xl font-bold text-slate-800">{{ c.name }}</h1>
      <app-fretboard-diagram [dots]="dots()" [mutedStrings]="muted()" [startFret]="c.startFret ?? 1" [fretCount]="5"></app-fretboard-diagram>
    </div>
  } @else {
    <p class="text-slate-500">Accordo non trovato.</p>
  }
</main>

<main class="h-full w-full overflow-y-auto px-6 py-10">
  <a routerLink="/triads" class="mb-6 inline-block text-sm text-slate-500 hover:text-slate-700">&larr; Tutte le triadi</a>

  @if (triad(); as t) {
    <div class="flex flex-col items-center gap-4 rounded-xl bg-white p-8 shadow" style="max-width: 420px">
      <h1 class="text-2xl font-bold text-slate-800">{{ t.name }}</h1>
      @if (t.notes) {
        <p class="text-sm font-medium text-emerald-600">{{ t.notes.join(' - ') }}</p>
      }
      <p class="text-center text-sm text-slate-500">{{ t.description }}</p>
      <app-fretboard-diagram [dots]="t.dots" [startFret]="t.startFret" [fretCount]="t.fretCount"></app-fretboard-diagram>
    </div>
  } @else {
    <p class="text-slate-500">Triade non trovata.</p>
  }
</main>

<div class="w-full">
  <div class="flex items-center gap-3 rounded-t-xl bg-slate-900 px-5 py-3">
    <button
      type="button"
      class="inline-flex h-9 w-9 items-center justify-center rounded-full bg-emerald-500 text-white transition enabled:hover:bg-emerald-400 disabled:cursor-not-allowed disabled:opacity-40"
      [disabled]="!playerReady()"
      [attr.aria-label]="isPlaying() ? 'Pausa' : 'Play'"
      (click)="togglePlay()"
    >
      @if (isPlaying()) {
        <svg viewBox="0 0 24 24" class="h-4 w-4 fill-current" aria-hidden="true">
          <rect x="5" y="4" width="5" height="16" rx="1" />
          <rect x="14" y="4" width="5" height="16" rx="1" />
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" class="ml-0.5 h-4 w-4 fill-current" aria-hidden="true">
          <path d="M6 4 L20 12 L6 20 Z" />
        </svg>
      }
    </button>
    <button
      type="button"
      class="inline-flex h-9 w-9 items-center justify-center rounded-full bg-slate-700 text-white transition enabled:hover:bg-slate-600 disabled:cursor-not-allowed disabled:opacity-40"
      [disabled]="!playerReady()"
      aria-label="Stop"
      (click)="stop()"
    >
      <svg viewBox="0 0 24 24" class="h-3.5 w-3.5 fill-current" aria-hidden="true">
        <rect x="4" y="4" width="16" height="16" rx="1.5" />
      </svg>
    </button>
    <span class="text-sm text-slate-400">
      {{ playerReady() ? '' : 'Caricamento del player…' }}
    </span>
  </div>

  <div #alphaTabViewPort class="min-h-[400px] w-full overflow-x-auto rounded-b-xl bg-white p-4 shadow-lg"></div>
</div>

<div class="flex h-screen w-screen overflow-hidden bg-slate-100">
  <main class="min-w-0 flex-1 overflow-y-auto px-6 py-10">
    <h1 class="mb-6 text-3xl font-bold text-slate-800">Alpha Jazz Tabs</h1>
    @if (selectedFile(); as file) {
      <app-alphatab [scoreFile]="file"></app-alphatab>
    } @else {
      <p class="text-slate-500">Seleziona un brano dalla lista a destra.</p>
    }
  </main>

  <aside class="flex h-screen w-72 shrink-0 flex-col border-l border-slate-200 bg-white">
    <div class="relative shrink-0 p-4 pb-2">
      <input
        type="search"
        aria-label="Cerca un brano"
        placeholder="Cerca un brano…"
        class="w-full rounded-lg border border-slate-200 px-3 py-2 pr-8 text-sm text-slate-700 focus:border-slate-400 focus:outline-none"
        [ngModel]="search()"
        (ngModelChange)="search.set($event)"
      />
      @if (search()) {
        <button
          type="button"
          aria-label="Cancella ricerca"
          class="absolute top-1/2 right-6 -translate-y-1/2 text-slate-400 hover:text-slate-600"
          (click)="search.set('')"
        >
          ✕
        </button>
      }
    </div>

    <ul class="flex-1 overflow-y-auto px-4 pb-4">
      @for (score of filteredScores(); track score.id) {
        <li>
          <button
            type="button"
            class="w-full rounded-lg px-3 py-2 text-left text-sm transition"
            [class.bg-slate-900]="selectedFile() === score.file"
            [class.text-white]="selectedFile() === score.file"
            [class.text-slate-700]="selectedFile() !== score.file"
            [class.hover:bg-slate-100]="selectedFile() !== score.file"
            (click)="selectScore(score.file)"
          >
            <span class="block font-medium">
              @for (segment of score.title | highlight: search(); track $index) {
                @if (segment.match) {
                  <mark class="rounded-sm bg-amber-300 text-slate-900">{{ segment.text }}</mark>
                } @else {
                  {{ segment.text }}
                }
              }
            </span>
            <span
              class="block text-xs"
              [class.text-slate-300]="selectedFile() === score.file"
              [class.text-slate-400]="selectedFile() !== score.file"
            >
              @for (segment of score.artist | highlight: search(); track $index) {
                @if (segment.match) {
                  <mark class="rounded-sm bg-amber-300 text-slate-900">{{ segment.text }}</mark>
                } @else {
                  {{ segment.text }}
                }
              }
            </span>
          </button>
        </li>
      } @empty {
        <li class="px-3 py-2 text-sm text-slate-400">Nessun brano trovato.</li>
      }
    </ul>
  </aside>
</div>

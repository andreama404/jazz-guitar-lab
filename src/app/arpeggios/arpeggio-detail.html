<main class="h-full w-full overflow-y-auto px-6 py-10">
  <a routerLink="/arpeggios" class="mb-6 inline-block text-sm text-slate-500 hover:text-slate-700">&larr; Tutti gli arpeggi</a>

  @if (arpeggio(); as a) {
    <div class="flex flex-col items-center gap-4 rounded-xl bg-white p-8 shadow" style="max-width: 480px">
      <h1 class="text-2xl font-bold text-slate-800">{{ a.name }}</h1>
      @if (a.notes) {
        <p class="text-sm font-medium text-emerald-600">{{ a.notes.join(' - ') }}</p>
      }
      <p class="text-center text-sm text-slate-500">{{ a.description }}</p>
      <app-fretboard-diagram [dots]="a.dots" [startFret]="a.startFret" [fretCount]="a.fretCount"></app-fretboard-diagram>
    </div>
  } @else {
    <p class="text-slate-500">Arpeggio non trovato.</p>
  }
</main>
